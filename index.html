<title>Wonder Maru</title>
<style>
    :root { --page-bg: #000000; --blob: #ffffff; --ink: #010101; }
    html, body { margin: 0; }
    body { background: var(--page-bg); }
    #wm-logo { display: block; width: min(80vw, 440px); height: auto; overflow: visible; touch-action: manipulation; -webkit-tap-highlight-color: transparent; cursor: pointer; }
    #wm-logo .wm-blob { fill: var(--blob); }
    #wm-logo .wm-text { fill: var(--ink); pointer-events: none; }
    /* Demo layout: tall page with a pinned logo so scrolling can be tried. Remove when integrating. */
    .stage { min-height: 300vh; display: flex; justify-content: center; }
    .sticky { position: sticky; top: 0; height: 100vh; display: grid; place-items: center; }
</style>

<script>
/* Wonder Maru - gelatin blob. The circle is a ring of spring-linked points; the lettering is a
   separate group that only moves if letterResponse is above 0. */
(() => {
  const svg  = document.getElementById('wm-logo');
  const blob = document.getElementById('wm-blob');
  if (!svg || !blob) return;

  /* ---- Tuning knobs ---- */
  const CFG = {
    stiffness: 76,
    coupling: 285,
    damping: 3.4,
    volume: 60,
    maxOffset: 0.1,
    tapStrength: 140,
    scrollGain: 0.7,
    scrollMax: 90,
    idleEvery: 6000,
    idleStrength: 70,
    letterResponse: 0.2,
  };

  /* Circle geometry (SVG units, from the original artwork) */
  const CX = 306, CY = 396, R = 162.72, N = 28;

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const amp = reduceMotion ? 0.35 : 1;

  const ang = Array.from({ length: N }, (_, i) => (i / N) * Math.PI * 2);
  const x = new Float32Array(N);   // radial offset of each point
  const v = new Float32Array(N);   // radial velocity
  const a = new Float32Array(N);   // scratch: acceleration

  function pointAt(i) {
    const k = (i + N) % N;
    const r = R + x[k];
    return [CX + Math.cos(ang[k]) * r, CY + Math.sin(ang[k]) * r];
  }
  function draw() {
    let d = '';
    for (let i = 0; i < N; i++) {
      const p0 = pointAt(i - 1), p1 = pointAt(i), p2 = pointAt(i + 1), p3 = pointAt(i + 2);
      if (i === 0) d += `M${p1[0].toFixed(2)},${p1[1].toFixed(2)}`;
      const c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = p1[1] + (p2[1] - p0[1]) / 6;
      const c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = p2[1] - (p3[1] - p1[1]) / 6;
      d += `C${c1x.toFixed(2)},${c1y.toFixed(2)} ${c2x.toFixed(2)},${c2y.toFixed(2)} ${p2[0].toFixed(2)},${p2[1].toFixed(2)}`;
    }
    blob.setAttribute('d', d + 'Z');
    applyLetters();
  }

  /* Lettering follows the blob's two lowest wobble modes, scaled by CFG.letterResponse:
     mode 1 = the blob's centre drifting, mode 2 = the blob going oval. At 0 the letters never move. */
  const letters = document.getElementById('wm-text');
  function applyLetters() {
    if (!letters) return;
    const k = CFG.letterResponse;
    if (!k) { letters.removeAttribute('transform'); return; }
    let sx = 0, sy = 0, ec = 0, es = 0;
    for (let i = 0; i < N; i++) {
      const t = ang[i];
      sx += x[i] * Math.cos(t);     sy += x[i] * Math.sin(t);
      ec += x[i] * Math.cos(2 * t); es += x[i] * Math.sin(2 * t);
    }
    const s = 2 / N;
    sx *= s; sy *= s; ec *= s; es *= s;
    const m11 = 1 + k * ec / R, m12 = k * es / R, m22 = 1 - k * ec / R;
    const e = CX + k * sx - m11 * CX - m12 * CY;
    const f = CY + k * sy - m12 * CX - m22 * CY;
    letters.setAttribute('transform', `matrix(${m11} ${m12} ${m12} ${m22} ${e} ${f})`);
  }

  /* Physics (fixed timestep for stability) */
  const H = 1 / 120;
  function step() {
    const limit = R * CFG.maxOffset;
    let mean = 0;
    for (let i = 0; i < N; i++) mean += x[i];
    mean /= N;
    for (let i = 0; i < N; i++) {
      const l = x[(i - 1 + N) % N], r = x[(i + 1) % N];
      a[i] = -CFG.stiffness * x[i] - CFG.damping * v[i] + CFG.coupling * (l + r - 2 * x[i]) - CFG.volume * mean;
    }
    for (let i = 0; i < N; i++) {
      v[i] += a[i] * H;
      x[i] += v[i] * H;
      if (x[i] >  limit) { x[i] =  limit; v[i] *= 0.5; }
      if (x[i] < -limit) { x[i] = -limit; v[i] *= 0.5; }
    }
  }

  /* Animation loop: runs only while the blob is moving */
  let running = false, last = 0, acc = 0;
  function frame(t) {
    acc += Math.min((t - last) / 1000, 0.05);
    last = t;
    while (acc >= H) { step(); acc -= H; }
    let moving = false;
    for (let i = 0; i < N; i++) {
      if (Math.abs(x[i]) > 0.01 || Math.abs(v[i]) > 0.05) { moving = true; break; }
    }
    if (moving) { draw(); requestAnimationFrame(frame); }
    else { x.fill(0); v.fill(0); draw(); running = false; }
  }
  function wake() {
    if (running) return;
    running = true; last = performance.now(); acc = 0;
    requestAnimationFrame(frame);
  }

  /* Kicks. The average is removed so the blob keeps its volume: pushing one side in makes the
     other sides bulge, like jelly. */
  let lastActivity = performance.now();
  function kick(fn, scale) {
    const tmp = new Float32Array(N);
    let mean = 0;
    for (let i = 0; i < N; i++) { tmp[i] = fn(ang[i]); mean += tmp[i]; }
    mean /= N;
    for (let i = 0; i < N; i++) v[i] += (tmp[i] - mean) * scale * amp;
    wake();
  }
  const wrap = d => Math.atan2(Math.sin(d), Math.cos(d));
  const poke = (at, sigma) => th => -Math.exp(-(wrap(th - at) ** 2) / (2 * sigma * sigma));

  /* Tap / click. Pointer events cover mouse, pen and touch. touchstart is a fallback for
     webviews (some iOS ones) that skip pointer events; the timestamp check stops a double kick. */
  let lastPointer = -1000;
  function tapFrom(cx, cy) {
    const box = svg.getBoundingClientRect();
    const scale = 360 / Math.min(box.width, box.height);   // the viewBox is 360 units square
    const dx = (cx - (box.left + box.width / 2)) * scale;
    const dy = (cy - (box.top + box.height / 2)) * scale;
    const dist = Math.hypot(dx, dy);
    if (dist > R * 1.3) return;
    const d = Math.min(dist / R, 1);      // 0 = centre, 1 = edge
    const at = Math.atan2(dy, dx);
    const pk = poke(at, 1.1 - 0.55 * d);
    kick(th => d * pk(th) + (1 - d) * 0.8 * Math.cos(2 * th), CFG.tapStrength);
    lastActivity = performance.now();
  }
  svg.addEventListener('pointerdown', e => { lastPointer = e.timeStamp; tapFrom(e.clientX, e.clientY); });
  svg.addEventListener('touchstart', e => {
    if (e.timeStamp - lastPointer < 500) return;
    const t = e.changedTouches[0];
    if (t) tapFrom(t.clientX, t.clientY);
  }, { passive: true });

  /* Scroll */
  let lastY = window.scrollY;
  if (!reduceMotion) {
    window.addEventListener('scroll', () => {
      const dy = window.scrollY - lastY;
      lastY = window.scrollY;
      if (!dy) return;
      const s = Math.min(Math.abs(dy) * CFG.scrollGain, CFG.scrollMax);
      const dir = Math.sign(dy);
      kick(th => -Math.cos(2 * th) + dir * 0.6 * Math.sin(th), s);
      lastActivity = performance.now();
    }, { passive: true });
  }

  /* Idle nudge: one small disturbance after a stretch of calm */
  if (!reduceMotion) {
    setInterval(() => {
      if (document.hidden) return;
      const now = performance.now();
      if (now - lastActivity < CFG.idleEvery) return;
      kick(poke(Math.random() * Math.PI * 2, 0.6), CFG.idleStrength);
      lastActivity = now;
    }, 500);
  }

  draw();
})();
</script>
</body>
</html>
