<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blob Logo Tuner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  /* Layout: logo stage pinned on the left, controls scroll on the right.
     Below 860px the stage pins to the top and the controls scroll under it. */
  :root {
    --bg: #f3f4f6;
    --surface: #ffffff;
    --fg: #16181d;
    --muted: #5d6470;
    --border: #dcdfe5;
    --accent: #2f4b7c;
    --accent-fg: #ffffff;
    --track: #cfd4dd;
    --code-bg: #eceef2;
    --font-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    --gutter: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101216;
      --surface: #181b21;
      --fg: #eceef2;
      --muted: #9aa2b0;
      --border: #2a2f38;
      --accent: #8fb0e8;
      --accent-fg: #0e1a30;
      --track: #333a46;
      --code-bg: #0d0f13;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101216;
    --surface: #181b21;
    --fg: #eceef2;
    --muted: #9aa2b0;
    --border: #2a2f38;
    --accent: #8fb0e8;
    --accent-fg: #0e1a30;
    --track: #333a46;
    --code-bg: #0d0f13;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.5;
    padding-inline: var(--gutter);
    padding-block: 24px 48px;
  }
  .wrap { max-width: 1080px; margin-inline: auto; }

  .head h1 { font-size: 1.5rem; line-height: 1.2; margin: 0 0 .25rem; font-weight: 600; text-wrap: balance; }
  .head p { margin: 0; color: var(--muted); max-width: 62ch; }

  .layout { display: grid; grid-template-columns: minmax(0, 400px) minmax(0, 1fr); gap: 32px; margin-top: 24px; align-items: start; }

  /* ---- Stage ---- */
  .stage-col { position: sticky; top: calc(16px + env(safe-area-inset-top, 0px)); }
  .stage {
    --stage-bg: #2f4b7c; --blob: #ffffff; --ink: #010101;
    background: var(--stage-bg);
    border-radius: 18px;
    padding: 28px 24px 20px;
    display: grid;
    gap: 18px;
  }
  #wm-logo {
    display: block; width: min(100%, 340px); height: auto; margin-inline: auto;
    overflow: visible; touch-action: manipulation; cursor: pointer;
    -webkit-tap-highlight-color: transparent; user-select: none;
  }
  #wm-logo .wm-blob { fill: var(--blob); }
  #wm-logo .wm-text { fill: var(--ink); pointer-events: none; }

  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .status { margin: 0; font: 400 12px/1.4 var(--font-mono); color: rgba(255,255,255,.78); text-align: center; font-variant-numeric: tabular-nums; }

  /* ---- Buttons ---- */
  .btn {
    font: 500 13px/1 var(--font-body);
    padding: 10px 12px; border-radius: 8px; cursor: pointer;
    border: 1px solid rgba(255,255,255,.35); background: rgba(255,255,255,.12); color: #fff;
  }
  .btn:hover { background: rgba(255,255,255,.22); }
  .panel .btn { border-color: var(--border); background: var(--surface); color: var(--fg); }
  .panel .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .btn:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .stage .btn:focus-visible { outline-color: #fff; }

  /* ---- Panel ---- */
  .panel { display: grid; gap: 20px; min-width: 0; }
  .group { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px 18px 6px; }
  .group h2 { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; font-weight: 600; }
  .row { padding-block: 10px 14px; border-top: 1px solid var(--border); }
  .row:first-of-type { border-top: 0; padding-top: 0; }
  .row-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .row label { font-weight: 500; }
  .row output { font: 500 13px var(--font-mono); font-variant-numeric: tabular-nums; color: var(--accent); }
  .row .hint { margin: 2px 0 8px; color: var(--muted); font-size: 13px; }
  input[type="range"] { width: 100%; accent-color: var(--accent); margin: 0; }

  .colors { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; padding-bottom: 16px; }
  .colors label { display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
  .colors input[type="color"] { width: 100%; height: 38px; padding: 2px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); cursor: pointer; }

  .out-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .out-head h2 { margin: 0; }
  .out-actions { display: flex; gap: 8px; }
  .out-actions .btn { padding: 8px 12px; }
  pre.code {
    margin: 0 0 16px; padding: 14px; background: var(--code-bg); border-radius: 10px;
    font: 400 12.5px/1.6 var(--font-mono); overflow-x: auto; color: var(--fg);
  }
  .note { margin: 0; color: var(--muted); font-size: 13px; }
  textarea.export {
    display: block; width: 100%; min-height: 220px; resize: vertical; margin: 0 0 12px; padding: 14px;
    background: var(--code-bg); color: var(--fg); border: 1px solid var(--border); border-radius: 10px;
    font: 400 12px/1.5 var(--font-mono);
  }
  textarea.export:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .runway {
    margin-top: 32px; min-height: 70vh; border: 1px dashed var(--border); border-radius: 14px;
    display: grid; place-items: start center; padding: 20px; color: var(--muted); font-size: 13px; text-align: center;
  }

  @media (max-width: 859px) {
    .layout { grid-template-columns: minmax(0, 1fr); gap: 16px; }
    .stage-col { top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 8px; }
    .stage { grid-template-columns: minmax(0, 150px) minmax(0, 1fr); align-items: center; padding: 16px; gap: 14px; }
    #wm-logo { width: 100%; }
    .actions { grid-template-columns: 1fr; }
    .status { grid-column: 1 / -1; }
  }
  @media (max-width: 480px) {
    .colors { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
</style>
</head>
<body>

<main class="wrap">
  <header class="head">
    <h1>Blob Logo Tuner</h1>
    <p>Adjust the springs and watch the Wonder Maru logo respond. Tap the circle, scroll the page, or use the test buttons. When it feels right, copy the settings into your site's script.</p>
  </header>

  <div class="layout">
    <section class="stage-col" aria-label="Logo preview">
      <div class="stage" id="stage">
        <svg id="wm-logo" xmlns="http://www.w3.org/2000/svg" viewBox="126 216 360 360" role="img" aria-label="Wonder Maru">
          <path id="wm-blob" class="wm-blob" d="M143.28,396a162.72,162.72 0 1,0 325.44,0a162.72,162.72 0 1,0 -325.44,0Z"/>
          <g class="wm-text" id="wm-text">

        <div class="actions">
          <button type="button" class="btn" id="btn-edge">Edge tap</button>
          <button type="button" class="btn" id="btn-center">Center squash</button>

        <p class="status" id="status" aria-live="off">&nbsp;</p>

    <section class="panel" id="panel" aria-label="Settings"></section>

<!-- Source of the exported page's script. Not executed here; the panel fills in the settings. -->
<script type="text/plain" id="export-engine">
/* Wonder Maru - gelatin blob. The circle is a ring of spring-linked points; the lettering is a
   separate group that only moves if letterResponse is above 0. */
(() => {
  const svg  = document.getElementById('wm-logo');
  const blob = document.getElementById('wm-blob');
  if (!svg || !blob) return;

  /* ---- Tuning knobs ---- */
  /*__CFG__*/

  /* Circle geometry (SVG units, from the original artwork) */
  const CX = 306, CY = 396, R = 162.72, N = 28;

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const amp = reduceMotion ? 0.35 : 1;

  const ang = Array.from({ length: N }, (_, i) => (i / N) * Math.PI * 2);
  const x = new Float32Array(N);   // radial offset of each point
  const v = new Float32Array(N);   // radial velocity
  const a = new Float32Array(N);   // scratch: acceleration

  function pointAt(i) {
    const k = (i + N) % N;
    const r = R + x[k];
    return [CX + Math.cos(ang[k]) * r, CY + Math.sin(ang[k]) * r];
  }
  function draw() {
    let d = '';
    for (let i = 0; i < N; i++) {
      const p0 = pointAt(i - 1), p1 = pointAt(i), p2 = pointAt(i + 1), p3 = pointAt(i + 2);
      if (i === 0) d += `M${p1[0].toFixed(2)},${p1[1].toFixed(2)}`;
      const c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = p1[1] + (p2[1] - p0[1]) / 6;
      const c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = p2[1] - (p3[1] - p1[1]) / 6;
      d += `C${c1x.toFixed(2)},${c1y.toFixed(2)} ${c2x.toFixed(2)},${c2y.toFixed(2)} ${p2[0].toFixed(2)},${p2[1].toFixed(2)}`;
    }
    blob.setAttribute('d', d + 'Z');
    applyLetters();
  }

  /* Lettering follows the blob's two lowest wobble modes, scaled by CFG.letterResponse:
     mode 1 = the blob's centre drifting, mode 2 = the blob going oval. At 0 the letters never move. */
  const letters = document.getElementById('wm-text');
  function applyLetters() {
    if (!letters) return;
    const k = CFG.letterResponse;
    if (!k) { letters.removeAttribute('transform'); return; }
    let sx = 0, sy = 0, ec = 0, es = 0;
    for (let i = 0; i < N; i++) {
      const t = ang[i];
      sx += x[i] * Math.cos(t);     sy += x[i] * Math.sin(t);
      ec += x[i] * Math.cos(2 * t); es += x[i] * Math.sin(2 * t);
    }
    const s = 2 / N;
    sx *= s; sy *= s; ec *= s; es *= s;
    const m11 = 1 + k * ec / R, m12 = k * es / R, m22 = 1 - k * ec / R;
    const e = CX + k * sx - m11 * CX - m12 * CY;
    const f = CY + k * sy - m12 * CX - m22 * CY;
    letters.setAttribute('transform', `matrix(${m11} ${m12} ${m12} ${m22} ${e} ${f})`);
  }

  /* Physics (fixed timestep for stability) */
  const H = 1 / 120;
  function step() {
    const limit = R * CFG.maxOffset;
    let mean = 0;
    for (let i = 0; i < N; i++) mean += x[i];
    mean /= N;
    for (let i = 0; i < N; i++) {
      const l = x[(i - 1 + N) % N], r = x[(i + 1) % N];
      a[i] = -CFG.stiffness * x[i] - CFG.damping * v[i] + CFG.coupling * (l + r - 2 * x[i]) - CFG.volume * mean;
    }
    for (let i = 0; i < N; i++) {
      v[i] += a[i] * H;
      x[i] += v[i] * H;
      if (x[i] >  limit) { x[i] =  limit; v[i] *= 0.5; }
      if (x[i] < -limit) { x[i] = -limit; v[i] *= 0.5; }
    }
  }

  /* Animation loop: runs only while the blob is moving */
  let running = false, last = 0, acc = 0;
  function frame(t) {
    acc += Math.min((t - last) / 1000, 0.05);
    last = t;
    while (acc >= H) { step(); acc -= H; }
    let moving = false;
    for (let i = 0; i < N; i++) {
      if (Math.abs(x[i]) > 0.01 || Math.abs(v[i]) > 0.05) { moving = true; break; }
    }
    if (moving) { draw(); requestAnimationFrame(frame); }
    else { x.fill(0); v.fill(0); draw(); running = false; }
  }
  function wake() {
    if (running) return;
    running = true; last = performance.now(); acc = 0;
    requestAnimationFrame(frame);
  }

  /* Kicks. The average is removed so the blob keeps its volume: pushing one side in makes the
     other sides bulge, like jelly. */
  let lastActivity = performance.now();
  function kick(fn, scale) {
    const tmp = new Float32Array(N);
    let mean = 0;
    for (let i = 0; i < N; i++) { tmp[i] = fn(ang[i]); mean += tmp[i]; }
    mean /= N;
    for (let i = 0; i < N; i++) v[i] += (tmp[i] - mean) * scale * amp;
    wake();
  }
  const wrap = d => Math.atan2(Math.sin(d), Math.cos(d));
  const poke = (at, sigma) => th => -Math.exp(-(wrap(th - at) ** 2) / (2 * sigma * sigma));

  /* Tap / click. Pointer events cover mouse, pen and touch. touchstart is a fallback for
     webviews (some iOS ones) that skip pointer events; the timestamp check stops a double kick. */
  let lastPointer = -1000;
  function tapFrom(cx, cy) {
    const box = svg.getBoundingClientRect();
    const scale = 360 / Math.min(box.width, box.height);   // the viewBox is 360 units square
    const dx = (cx - (box.left + box.width / 2)) * scale;
    const dy = (cy - (box.top + box.height / 2)) * scale;
    const dist = Math.hypot(dx, dy);
    if (dist > R * 1.3) return;
    const d = Math.min(dist / R, 1);      // 0 = centre, 1 = edge
    const at = Math.atan2(dy, dx);
    const pk = poke(at, 1.1 - 0.55 * d);
    kick(th => d * pk(th) + (1 - d) * 0.8 * Math.cos(2 * th), CFG.tapStrength);
    startFlurry();
    lastActivity = performance.now();
  }

  /* Tap color flurry: the circle sweeps around the color wheel, then eases back to its own color.
     Colors share one perceived lightness (OKLCH), so the sweep does not flicker. Off with reduce motion. */
  let flurry = null, baseRGB = null, flurryTicking = false;
  const parseRGB = s => { const m = String(s).match(/[\d.]+/g); return m && m.length >= 3 ? m.slice(0, 3).map(Number) : null; };
  function oklchToRGB(L, C, hDeg) {
    const h = hDeg * Math.PI / 180, a = C * Math.cos(h), b = C * Math.sin(h);
    const l = (L + 0.3963377774 * a + 0.2158037573 * b) ** 3;
    const m = (L - 0.1055613458 * a - 0.0638541728 * b) ** 3;
    const s = (L - 0.0894841775 * a - 1.2914855480 * b) ** 3;
    const lin = [ 4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
                 -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
                 -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s];
    return lin.map(c => { c = Math.min(1, Math.max(0, c)); return Math.round(255 * (c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(c, 1 / 2.4) - 0.055)); });
  }
  function startFlurry() {
    if (reduceMotion || !CFG.flurryOn || !(CFG.flurryTime > 0)) return;
    const restart = !!flurry;
    if (!restart) baseRGB = parseRGB(getComputedStyle(blob).fill);
    flurry = { t0: performance.now(), hue0: restart ? flurry.hue : Math.random() * 360, hue: 0, skipIn: restart };
    if (!flurryTicking) { flurryTicking = true; requestAnimationFrame(flurryFrame); }
  }
  function flurryFrame(t) {
    if (!flurry) { flurryTicking = false; return; }
    const dur = CFG.flurryTime, el = Math.max(0, t - flurry.t0);
    if (el >= dur) { blob.style.fill = ''; flurry = null; flurryTicking = false; return; }
    flurry.hue = flurry.hue0 + (el / 1000) * CFG.flurrySpeed * 360;
    let rgb = oklchToRGB(0.8, 0.15, flurry.hue);
    const edge = Math.min(250, dur * 0.4), fadeIn = flurry.skipIn ? 0 : Math.min(120, dur * 0.2);
    let w = 0;
    if (el > dur - edge) w = (el - (dur - edge)) / edge;
    else if (el < fadeIn) w = 1 - el / fadeIn;
    if (w > 0 && baseRGB) { const e = w * w * (3 - 2 * w); rgb = rgb.map((c, i) => Math.round(c + (baseRGB[i] - c) * e)); }
    blob.style.fill = `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`;
    requestAnimationFrame(flurryFrame);
  }

  svg.addEventListener('pointerdown', e => { lastPointer = e.timeStamp; tapFrom(e.clientX, e.clientY); });
  svg.addEventListener('touchstart', e => {
    if (e.timeStamp - lastPointer < 500) return;
    const t = e.changedTouches[0];
    if (t) tapFrom(t.clientX, t.clientY);
  }, { passive: true });

  /* Scroll */
  let lastY = window.scrollY;
  if (!reduceMotion) {
    window.addEventListener('scroll', () => {
      const dy = window.scrollY - lastY;
      lastY = window.scrollY;
      if (!dy) return;
      const s = Math.min(Math.abs(dy) * CFG.scrollGain, CFG.scrollMax);
      const dir = Math.sign(dy);
      kick(th => -Math.cos(2 * th) + dir * 0.6 * Math.sin(th), s);
      startFlurry();
      lastActivity = performance.now();
    }, { passive: true });
  }

  /* Idle nudge: one small disturbance after a stretch of calm */
  if (!reduceMotion) {
    setInterval(() => {
      if (document.hidden) return;
      const now = performance.now();
      if (now - lastActivity < CFG.idleEvery) return;
      kick(poke(Math.random() * Math.PI * 2, 0.6), CFG.idleStrength);
      lastActivity = now;
    }, 500);
  }

  /* Play one wobble (and the color flurry, if on) when the page first loads */
  function playIntro() {
    if (!CFG.playOnLoad) return;
    const at = Math.random() * Math.PI * 2, d = 0.6;
    const pk = poke(at, 1.1 - 0.55 * d);
    kick(th => d * pk(th) + (1 - d) * 0.8 * Math.cos(2 * th), CFG.tapStrength);
    startFlurry();
    lastActivity = performance.now();
  }
  if (document.readyState === 'complete') setTimeout(playIntro, 350);
  else window.addEventListener('load', () => setTimeout(playIntro, 350), { once: true });

  draw();
})();
</script>

<script>
(() => {
  /* ======================= Logo physics (same engine as the site version) ======================= */
  const svg   = document.getElementById('wm-logo');
  const blob  = document.getElementById('wm-blob');
  const stage = document.getElementById('stage');

  const DEFAULTS = {
    stiffness: 90, coupling: 300, damping: 3.4, volume: 60, maxOffset: 0.22,
    tapStrength: 150, scrollGain: 0.8, scrollMax: 90,
    idleEvery: 10000, idleStrength: 70,
    letterResponse: 0,
    flurryOn: 1, flurryTime: 900, flurrySpeed: 2,
    playOnLoad: 1
  };
  const CFG = { ...DEFAULTS };

  const CX = 306, CY = 396, R = 162.72, N = 28;
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const amp = reduceMotion ? 0.35 : 1;

  const ang = Array.from({ length: N }, (_, i) => (i / N) * Math.PI * 2);
  const x = new Float32Array(N), v = new Float32Array(N), a = new Float32Array(N);

  function pointAt(i) {
    const k = (i + N) % N, r = R + x[k];
    return [CX + Math.cos(ang[k]) * r, CY + Math.sin(ang[k]) * r];
  }
  function draw() {
    let d = '';
    for (let i = 0; i < N; i++) {
      const p0 = pointAt(i - 1), p1 = pointAt(i), p2 = pointAt(i + 1), p3 = pointAt(i + 2);
      if (i === 0) d += `M${p1[0].toFixed(2)},${p1[1].toFixed(2)}`;
      const c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = p1[1] + (p2[1] - p0[1]) / 6;
      const c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = p2[1] - (p3[1] - p1[1]) / 6;
      d += `C${c1x.toFixed(2)},${c1y.toFixed(2)} ${c2x.toFixed(2)},${c2y.toFixed(2)} ${p2[0].toFixed(2)},${p2[1].toFixed(2)}`;
    }
    blob.setAttribute('d', d + 'Z');
    applyLetters();
  }

  /* Lettering follows the blob's two lowest wobble modes, scaled by CFG.letterResponse:
     mode 1 = the blob's centre drifting, mode 2 = the blob going oval. At 0 the letters never move. */
  const letters = document.getElementById('wm-text');
  function applyLetters() {
    const k = CFG.letterResponse;
    if (!k) { letters.removeAttribute('transform'); return; }
    let sx = 0, sy = 0, ec = 0, es = 0;
    for (let i = 0; i < N; i++) {
      const t = ang[i];
      sx += x[i] * Math.cos(t);     sy += x[i] * Math.sin(t);
      ec += x[i] * Math.cos(2 * t); es += x[i] * Math.sin(2 * t);
    }
    const s = 2 / N;
    sx *= s; sy *= s; ec *= s; es *= s;
    const m11 = 1 + k * ec / R, m12 = k * es / R, m22 = 1 - k * ec / R;
    const e = CX + k * sx - m11 * CX - m12 * CY;
    const f = CY + k * sy - m12 * CX - m22 * CY;
    letters.setAttribute('transform', `matrix(${m11} ${m12} ${m12} ${m22} ${e} ${f})`);
  }

  const H = 1 / 120;
  function step() {
    const limit = R * CFG.maxOffset;
    let mean = 0;
    for (let i = 0; i < N; i++) mean += x[i];
    mean /= N;
    for (let i = 0; i < N; i++) {
      const l = x[(i - 1 + N) % N], r = x[(i + 1) % N];
      a[i] = -CFG.stiffness * x[i] - CFG.damping * v[i] + CFG.coupling * (l + r - 2 * x[i]) - CFG.volume * mean;
    }
    for (let i = 0; i < N; i++) {
      v[i] += a[i] * H;
      x[i] += v[i] * H;
      if (x[i] >  limit) { x[i] =  limit; v[i] *= 0.5; }
      if (x[i] < -limit) { x[i] = -limit; v[i] *= 0.5; }
    }
  }

  let running = false, last = 0, acc = 0;
  function frame(t) {
    acc += Math.min((t - last) / 1000, 0.05);
    last = t;
    while (acc >= H) { step(); acc -= H; }
    let moving = false;
    for (let i = 0; i < N; i++) {
      if (Math.abs(x[i]) > 0.01 || Math.abs(v[i]) > 0.05) { moving = true; break; }
    }
    if (moving) { draw(); requestAnimationFrame(frame); }
    else { x.fill(0); v.fill(0); draw(); running = false; }
  }
  function wake() {
    if (running) return;
    running = true; last = performance.now(); acc = 0;
    requestAnimationFrame(frame);
  }

  let lastActivity = performance.now();
  function kick(fn, scale) {
    const tmp = new Float32Array(N);
    let mean = 0;
    for (let i = 0; i < N; i++) { tmp[i] = fn(ang[i]); mean += tmp[i]; }
    mean /= N;
    for (let i = 0; i < N; i++) v[i] += (tmp[i] - mean) * scale * amp;
    wake();
  }
  const wrap = d => Math.atan2(Math.sin(d), Math.cos(d));
  const poke = (at, sigma) => th => -Math.exp(-(wrap(th - at) ** 2) / (2 * sigma * sigma));

  function tapAt(at, d) {            // d: 0 = center, 1 = edge
    const pk = poke(at, 1.1 - 0.55 * d);
    kick(th => d * pk(th) + (1 - d) * 0.8 * Math.cos(2 * th), CFG.tapStrength);
    startFlurry();
    lastActivity = performance.now();
  }

  /* ---- Tap color flurry: the circle sweeps around the color wheel, then eases back to its own color.
     Colors share one perceived lightness (OKLCH), so the sweep does not flicker. Off with reduce motion. ---- */
  let flurry = null, baseRGB = null, flurryTicking = false;
  const parseRGB = s => { const m = String(s).match(/[\d.]+/g); return m && m.length >= 3 ? m.slice(0, 3).map(Number) : null; };
  function oklchToRGB(L, C, hDeg) {
    const h = hDeg * Math.PI / 180, a = C * Math.cos(h), b = C * Math.sin(h);
    const l = (L + 0.3963377774 * a + 0.2158037573 * b) ** 3;
    const m = (L - 0.1055613458 * a - 0.0638541728 * b) ** 3;
    const s = (L - 0.0894841775 * a - 1.2914855480 * b) ** 3;
    const lin = [ 4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
                 -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
                 -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s];
    return lin.map(c => { c = Math.min(1, Math.max(0, c)); return Math.round(255 * (c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(c, 1 / 2.4) - 0.055)); });
  }
  function startFlurry() {
    if (reduceMotion || !CFG.flurryOn || !(CFG.flurryTime > 0)) return;
    const restart = !!flurry;
    if (!restart) baseRGB = parseRGB(getComputedStyle(blob).fill);
    flurry = { t0: performance.now(), hue0: restart ? flurry.hue : Math.random() * 360, hue: 0, skipIn: restart };
    if (!flurryTicking) { flurryTicking = true; requestAnimationFrame(flurryFrame); }
  }
  function flurryFrame(t) {
    if (!flurry) { flurryTicking = false; return; }
    const dur = CFG.flurryTime, el = Math.max(0, t - flurry.t0);
    if (el >= dur) { blob.style.fill = ''; flurry = null; flurryTicking = false; return; }
    flurry.hue = flurry.hue0 + (el / 1000) * CFG.flurrySpeed * 360;
    let rgb = oklchToRGB(0.8, 0.15, flurry.hue);
    const edge = Math.min(250, dur * 0.4), fadeIn = flurry.skipIn ? 0 : Math.min(120, dur * 0.2);
    let w = 0;
    if (el > dur - edge) w = (el - (dur - edge)) / edge;
    else if (el < fadeIn) w = 1 - el / fadeIn;
    if (w > 0 && baseRGB) { const e = w * w * (3 - 2 * w); rgb = rgb.map((c, i) => Math.round(c + (baseRGB[i] - c) * e)); }
    blob.style.fill = `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`;
    requestAnimationFrame(flurryFrame);
  }

  function idleNudge() {
    kick(poke(Math.random() * Math.PI * 2, 0.6), CFG.idleStrength);
    lastActivity = performance.now();
  }

  svg.addEventListener('pointerdown', e => {
    const pt = svg.createSVGPoint();
    pt.x = e.clientX; pt.y = e.clientY;
    const p = pt.matrixTransform(svg.getScreenCTM().inverse());
    const dx = p.x - CX, dy = p.y - CY, dist = Math.hypot(dx, dy);
    if (dist > R * 1.3) return;
    tapAt(Math.atan2(dy, dx), Math.min(dist / R, 1));
  });

  let lastY = window.scrollY;
  if (!reduceMotion) {
    window.addEventListener('scroll', () => {
      const dy = window.scrollY - lastY;
      lastY = window.scrollY;
      if (!dy) return;
      const s = Math.min(Math.abs(dy) * CFG.scrollGain, CFG.scrollMax);
      const dir = Math.sign(dy);
      kick(th => -Math.cos(2 * th) + dir * 0.6 * Math.sin(th), s);
      startFlurry();
      lastActivity = performance.now();
    }, { passive: true });
  }

  /* ======================= Tuning panel ======================= */
  const GROUPS = [
    { title: 'Gelatin feel', items: [
      { key: 'stiffness', label: 'Stiffness', hint: 'How hard it snaps back to a circle. Lower is softer and slower.', min: 20, max: 300, step: 1 },
      { key: 'coupling', label: 'Coupling', hint: 'How much neighbouring points drag each other. Higher spreads a dent further around the edge.', min: 50, max: 800, step: 5 },
      { key: 'damping', label: 'Damping', hint: 'How quickly the wobble dies out. Lower keeps it jiggling longer.', min: 0.5, max: 12, step: 0.1 },
      { key: 'volume', label: 'Volume hold', hint: 'Resistance to growing or shrinking overall, so a dent pushes the rest outward.', min: 0, max: 200, step: 1 },
      { key: 'maxOffset', label: 'Max stretch', hint: 'The most any point can move, as a share of the radius.', min: 0.05, max: 0.4, step: 0.01 }
    ]},
    { title: 'Interaction', items: [
      { key: 'tapStrength', label: 'Tap strength', hint: 'Size of the kick from a tap or click.', min: 20, max: 400, step: 5 },
      { key: 'scrollGain', label: 'Scroll gain', hint: 'Kick per scrolled pixel.', min: 0.1, max: 3, step: 0.1 },
      { key: 'scrollMax', label: 'Scroll cap', hint: 'Upper limit on a single scroll kick, so fast flicks stay tame.', min: 10, max: 300, step: 5 }
    ]},
    { title: 'Color flurry', items: [
      { key: 'flurryOn', label: 'Color cycling', hint: 'On cycles the circle through colors on taps, clicks and scrolls. Off leaves its color alone.', min: 0, max: 1, step: 1, labels: ['Off', 'On'] },
      { key: 'flurryTime', label: 'Flurry length', hint: 'How long the circle cycles through colors after a tap, click or scroll. It keeps cycling while you scroll, then settles this long after you stop. 0 turns it off.', min: 0, max: 3000, step: 50, unit: ' ms' },
      { key: 'flurrySpeed', label: 'Flurry speed', hint: 'Trips around the color wheel per second. Keep it modest, since very fast cycling is hard on the eyes.', min: 0.5, max: 4, step: 0.1, unit: '/s' }
    ]},
    { title: 'Page load', items: [
      { key: 'playOnLoad', label: 'Play on load', hint: 'On plays one wobble, plus the color flurry if it is on, when the page first loads.', min: 0, max: 1, step: 1, labels: ['Off', 'On'] }
    ]},
    { title: 'Lettering', items: [
      { key: 'letterResponse', label: 'Letter response', hint: '0% keeps the letters perfectly still. Higher lets them drift and stretch along with the blob.', min: 0, max: 150, step: 5, factor: 0.01, unit: '%' }
    ]},
    { title: 'Idle nudge', items: [
      { key: 'idleEvery', label: 'Idle delay', hint: 'Seconds of calm before the nudge.', min: 2, max: 30, step: 1, factor: 1000, unit: ' s' },
      { key: 'idleStrength', label: 'Idle strength', hint: 'Size of the nudge.', min: 10, max: 200, step: 5 }
    ]}
  ];

  const panel = document.getElementById('panel');
  const inputs = {};   // key -> { input, out, item }
  const fmt = n => String(Number(n.toFixed(3)));

  GROUPS.forEach(g => {
    const sec = document.createElement('div');
    sec.className = 'group';
    const h = document.createElement('h2');
    h.textContent = g.title;
    sec.appendChild(h);
    g.items.forEach(it => {
      const f = it.factor || 1;
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML =
        `<div class="row-top"><label for="c-${it.key}">${it.label}</label><output for="c-${it.key}" id="o-${it.key}"></output></div>` +
        `<p class="hint">${it.hint}</p>` +
        `<input type="range" id="c-${it.key}" min="${it.min}" max="${it.max}" step="${it.step}">`;
      sec.appendChild(row);
      const input = row.querySelector('input'), out = row.querySelector('output');
      inputs[it.key] = { input, out, it };
      input.addEventListener('input', () => {
        CFG[it.key] = parseFloat(input.value) * f;
        syncRow(it.key);
        renderCode();
      });
    });
    panel.appendChild(sec);
  });

  function syncRow(key) {
    const { input, out, it } = inputs[key];
    const f = it.factor || 1;
    input.value = CFG[key] / f;
    out.textContent = it.labels ? it.labels[Math.round(CFG[key] / f)] : fmt(CFG[key] / f) + (it.unit || '');
  }

  /* Colors */
  const colorSec = document.createElement('div');
  colorSec.className = 'group';
  colorSec.innerHTML =
    '<h2>Colors</h2><div class="colors">' +
    '<label for="col-bg">Background<input type="color" id="col-bg" value="#2f4b7c"></label>' +
    '<label for="col-blob">Circle<input type="color" id="col-blob" value="#ffffff"></label>' +
    '<label for="col-ink">Lettering<input type="color" id="col-ink" value="#010101"></label></div>';
  panel.appendChild(colorSec);
  const COLORS = { 'col-bg': ['--stage-bg', '#2f4b7c'], 'col-blob': ['--blob', '#ffffff'], 'col-ink': ['--ink', '#010101'] };
  Object.entries(COLORS).forEach(([id, [prop]]) => {
    document.getElementById(id).addEventListener('input', e => stage.style.setProperty(prop, e.target.value));
  });

  /* Output */
  const outSec = document.createElement('div');
  outSec.className = 'group';
  outSec.innerHTML =
    '<div class="out-head"><h2>Your settings</h2><div class="out-actions">' +
    '<button type="button" class="btn" id="btn-reset">Reset</button>' +
    '<button type="button" class="btn primary" id="btn-copy">Copy settings</button></div></div>' +
    '<pre class="code" id="code" tabindex="0"></pre>' +
    '<p class="note" id="note" style="padding-bottom:16px">Replace the <code>CFG</code> block at the top of the script on your site with this one.</p>';
  panel.appendChild(outSec);
  const code = document.getElementById('code');

  /* ---- Export: a complete page built from the current settings and colors ---- */
  const expSec = document.createElement('div');
  expSec.className = 'group';
  expSec.innerHTML =
    '<div class="out-head"><h2>Export page</h2><div class="out-actions">' +
    '<button type="button" class="btn primary" id="btn-copy-html">Copy HTML</button></div></div>' +
    '<textarea class="export" id="export-html" readonly spellcheck="false" aria-label="Exported page HTML"></textarea>' +
    '<p class="note" style="padding-bottom:16px">A complete page with your current settings and colors. This view cannot save files, so copy it into a file named wonder-maru.html. To get it as an artifact, paste it into the chat and ask me to publish it.</p>';
  panel.appendChild(expSec);
  const exportBox = document.getElementById('export-html');

  function buildExport() {
    const cs = getComputedStyle(stage);
    const bg   = cs.getPropertyValue('--stage-bg').trim() || '#2f4b7c';
    const blobC = cs.getPropertyValue('--blob').trim() || '#ffffff';
    const ink  = cs.getPropertyValue('--ink').trim() || '#010101';

    const clone = svg.cloneNode(true);
    clone.querySelector('#wm-blob').setAttribute('d', 'M143.28,396a162.72,162.72 0 1,0 325.44,0a162.72,162.72 0 1,0 -325.44,0Z');
    clone.querySelector('#wm-text').removeAttribute('transform');
    clone.removeAttribute('style');

    const cfg = 'const CFG = {\n' + Object.keys(DEFAULTS).map(k => `    ${k}: ${fmt(CFG[k])},`).join('\n') + '\n  };';
    const engine = document.getElementById('export-engine').textContent.trim().replace('/*__CFG__*/', () => cfg);

    const css = [
      '    :root { --page-bg: ' + bg + '; --blob: ' + blobC + '; --ink: ' + ink + '; }',
      '    html, body { margin: 0; }',
      '    body { background: var(--page-bg); }',
      '    #wm-logo { display: block; width: min(80vw, 440px); height: auto; overflow: visible; touch-action: manipulation; -webkit-tap-highlight-color: transparent; cursor: pointer; }',
      '    #wm-logo .wm-blob { fill: var(--blob); }',
      '    #wm-logo .wm-text { fill: var(--ink); pointer-events: none; }',
      '    /* Demo layout: tall page with a pinned logo so scrolling can be tried. Remove when integrating. */',
      '    .stage { min-height: 300vh; display: flex; justify-content: center; }',
      '    .sticky { position: sticky; top: 0; height: 100vh; display: grid; place-items: center; }'
    ].join('\n');

    return [
      '<!doctype html>',
      '<html lang="en">',
      '<head>',
      '<meta charset="utf-8">',
      '<meta name="viewport" content="width=device-width, initial-scale=1">',
      '<title>Wonder Maru</title>',
      '<style>',
      css,
      '</style>',
      '</head>',
      '<body>',
      '<div class="stage"><div class="sticky">',
      clone.outerHTML,
      '</div></div>',
      '<scr' + 'ipt>',
      engine,
      '<' + '/script>',
      '</body>',
      '</html>',
      ''
    ].join('\n');
  }

  let exportTimer = 0;
  const refreshExport = () => { exportBox.value = buildExport(); };
  panel.addEventListener('input', () => { clearTimeout(exportTimer); exportTimer = setTimeout(refreshExport, 150); });
  panel.addEventListener('click', e => { if (e.target.id === 'btn-reset') setTimeout(refreshExport, 0); });
  refreshExport();

  const copyHtmlBtn = document.getElementById('btn-copy-html');
  copyHtmlBtn.addEventListener('click', async () => {
    refreshExport();
    let ok = false;
    try { await navigator.clipboard.writeText(exportBox.value); ok = true; } catch (_) {
      try { exportBox.focus(); exportBox.select(); ok = document.execCommand('copy'); } catch (__) { ok = false; }
    }
    copyHtmlBtn.textContent = ok ? 'Copied' : 'Selected: press Ctrl/Cmd+C';
    setTimeout(() => { copyHtmlBtn.textContent = 'Copy HTML'; }, 2000);
  });

  function renderCode() {
    const keys = Object.keys(DEFAULTS);
    code.textContent = 'const CFG = {\n' + keys.map(k => `  ${k}: ${fmt(CFG[k])},`).join('\n') + '\n};';
  }

  Object.keys(DEFAULTS).forEach(syncRow);
  renderCode();

  if (reduceMotion) {
    document.getElementById('note').textContent =
      'Your system has reduce motion turned on, so taps are softened and the scroll, idle and color flurry effects are off in this preview.';
  }

  /* Buttons */
  const copyBtn = document.getElementById('btn-copy');
  copyBtn.addEventListener('click', async () => {
    const text = code.textContent;
    let ok = false;
    try { await navigator.clipboard.writeText(text); ok = true; } catch (_) {
      try {
        const r = document.createRange(); r.selectNodeContents(code);
        const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
        ok = document.execCommand('copy');
      } catch (__) { ok = false; }
    }
    copyBtn.textContent = ok ? 'Copied' : 'Selected: press Ctrl/Cmd+C';
    setTimeout(() => { copyBtn.textContent = 'Copy settings'; }, 2000);
  });

  document.getElementById('btn-reset').addEventListener('click', () => {
    Object.assign(CFG, DEFAULTS);
    Object.keys(DEFAULTS).forEach(syncRow);
    Object.entries(COLORS).forEach(([id, [prop, def]]) => {
      document.getElementById(id).value = def;
      stage.style.removeProperty(prop);
    });
    renderCode();
  });

  document.getElementById('btn-edge').addEventListener('click', () => tapAt(Math.random() * Math.PI * 2, 1));
  document.getElementById('btn-center').addEventListener('click', () => tapAt(0, 0));
  document.getElementById('btn-idle').addEventListener('click', idleNudge);

  let scrollDir = 1;
  document.getElementById('btn-scroll').addEventListener('click', () => {
    const max = document.documentElement.scrollHeight - window.innerHeight;
    if (window.scrollY >= max - 5) scrollDir = -1;
    if (window.scrollY <= 5) scrollDir = 1;
    window.scrollBy({ top: scrollDir * Math.min(520, Math.max(max, 1)), behavior: 'smooth' });
  });

  /* Idle timer and status line */
  const status = document.getElementById('status');
  setInterval(() => {
    const left = Math.max(0, CFG.idleEvery - (performance.now() - lastActivity));
    if (reduceMotion) { status.textContent = 'idle nudge off (reduce motion)'; return; }
    status.textContent = 'next idle nudge in ' + Math.ceil(left / 1000) + ' s';
    if (!document.hidden && left <= 0) idleNudge();
  }, 250);

  /* Play one wobble (and the color flurry, if on) when the page first loads */
  function playIntro() {
    if (!CFG.playOnLoad) return;
    tapAt(Math.random() * Math.PI * 2, 0.6);
  }
  if (document.readyState === 'complete') setTimeout(playIntro, 350);
  else window.addEventListener('load', () => setTimeout(playIntro, 350), { once: true });

  draw();
})();
</script>
</body>
